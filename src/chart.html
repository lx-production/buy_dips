<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTCUSDT 4H Zones</title>
  <style>
    :root { color-scheme: dark; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090c10; color: #e6edf3; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #app, #chart { position: fixed; inset: 0; }
    .hud { position: fixed; top: 18px; left: 22px; z-index: 2; padding: 12px 14px; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: rgba(9,12,16,.78); backdrop-filter: blur(10px); box-shadow: 0 12px 40px rgba(0,0,0,.32); max-width: min(420px, calc(100vw - 44px)); }
    .hud-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .title { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
    .hud-toggle { flex: 0 0 auto; width: 24px; height: 24px; margin: 0; padding: 0; border: 1px solid rgba(255,255,255,.14); border-radius: 7px; color: #c9d1d9; background: rgba(13,17,23,.88); font: 700 14px/1 ui-sans-serif, system-ui; cursor: pointer; }
    .hud-toggle:hover { color: #e6edf3; border-color: rgba(255,255,255,.28); }
    .hud.collapsed { padding: 8px 10px; }
    .hud.collapsed .hud-body { display: none; }
    .meta { margin-top: 6px; color: #8b949e; font-size: 12px; line-height: 1.45; }
    .legend { display: flex; gap: 12px; margin-top: 9px; color: #c9d1d9; font-size: 12px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
    .support { background: #2ea043; }
    .pivot { background: #79c0ff; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; color: #c9d1d9; font-size: 12px; }
    .field { display: inline-flex; align-items: center; gap: 6px; }
    .field select, .controls button { color: #e6edf3; background: rgba(13,17,23,.88); border: 1px solid rgba(255,255,255,.14); border-radius: 7px; padding: 4px 10px; font: inherit; cursor: pointer; }
    .tooltip { position: fixed; z-index: 3; display: none; max-width: min(360px, calc(100vw - 24px)); padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: rgba(9,12,16,.92); color: #e6edf3; font-size: 12px; line-height: 1.45; pointer-events: none; white-space: pre-wrap; }
    .error { position: fixed; inset: auto 22px 22px 22px; padding: 12px 14px; border-radius: 10px; color: #ffdcd7; background: rgba(248,81,73,.14); border: 1px solid rgba(248,81,73,.35); font-size: 13px; display: none; }
  </style>
  <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="app"><div id="chart"></div></div>
  <div class="hud" id="hud">
    <div class="hud-header">
      <div class="title" id="title">BTCUSDT 4H</div>
      <button type="button" class="hud-toggle" id="hud-toggle" title="Minimize panel" aria-label="Minimize panel" aria-expanded="true">−</button>
    </div>
    <div class="hud-body" id="hud-body">
      <div class="meta" id="meta">Loading SQLite candles and zones…</div>
      <div class="legend">
        <span><i class="dot support"></i>Support</span>
        <span><i class="dot pivot"></i>Internal pivot</span>
      </div>
      <div class="controls">
        <label class="field">
          View
          <select id="view-select">
            <option value="4h-from-june">4H from 2026-06-01</option>
            <option value="1d-all">1D all candles</option>
          </select>
        </label>
        <button type="button" id="reset-view">Reset viewport</button>
      </div>
      <div class="meta">Times are UTC+7. Scroll to zoom time. Drag plot to pan. Drag / scroll the price axis to scale price.</div>
    </div>
  </div>
  <div class="tooltip" id="tooltip"></div>
  <div class="error" id="error"></div>
  <script>
    const container = document.getElementById('chart');
    const hud = document.getElementById('hud');
    const title = document.getElementById('title');
    const meta = document.getElementById('meta');
    const error = document.getElementById('error');
    const tooltip = document.getElementById('tooltip');
    const hudToggle = document.getElementById('hud-toggle');
    const viewSelect = document.getElementById('view-select');
    const resetView = document.getElementById('reset-view');
    const HUD_COLLAPSED_KEY = 'chartHudCollapsed';
    const viewOptions = {
      '4h-from-june': { timeframe: '4h', limit: 'all', start_ms: '__START_MS__' },
      '1d-all': { timeframe: '1d', limit: 'all' }
    };
    const BAR_SECONDS = { '4h': 4 * 3600, '1d': 86400 };

    let chartData = null;
    let visibleZones = [];
    let visiblePivots = [];
    let candleByTime = new Map();
    let barSeconds = BAR_SECONDS['4h'];
    let chart = null;
    let candleSeries = null;

    // Collapse the HUD so the panel stops covering the top-left of the chart.
    function setHudCollapsed(collapsed) {
      hud.classList.toggle('collapsed', collapsed);
      hudToggle.textContent = collapsed ? '+' : '−';
      hudToggle.title = collapsed ? 'Expand panel' : 'Minimize panel';
      hudToggle.setAttribute('aria-label', hudToggle.title);
      hudToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      try { localStorage.setItem(HUD_COLLAPSED_KEY, collapsed ? '1' : '0'); } catch (_) {}
    }

    function isHudCollapsedStored() {
      try { return localStorage.getItem(HUD_COLLAPSED_KEY) === '1'; } catch (_) { return false; }
    }

    setHudCollapsed(isHudCollapsedStored());
    hudToggle.addEventListener('click', () => {
      setHudCollapsed(!hud.classList.contains('collapsed'));
    });

    function toSec(ms) {
      return Math.floor(Number(ms) / 1000);
    }

    function barSecondsFor(timeframe) {
      return BAR_SECONDS[String(timeframe || '').toLowerCase()] || BAR_SECONDS['4h'];
    }

    // Map a UTC-ms bound onto the bar edge. valid_to is exclusive.
    function zoneEdgeX(timeScale, timeMs, which, spacing) {
      const sec = toSec(timeMs);
      const x = timeScale.timeToCoordinate(sec);
      if (x !== null) return x - spacing / 2;
      if (which === 'end') {
        const prev = timeScale.timeToCoordinate(sec - barSeconds);
        if (prev !== null) return prev + spacing / 2;
      }
      return null;
    }

    class ZoneBandsRenderer {
      constructor(boxes) {
        this._boxes = boxes;
      }
      draw(target) {
        target.useMediaCoordinateSpace((scope) => {
          const ctx = scope.context;
          ctx.font = '12px ui-sans-serif, system-ui';
          ctx.textAlign = 'left';
          for (const box of this._boxes) {
            const x = Math.min(box.x1, box.x2);
            const y = Math.min(box.y1, box.y2);
            const width = Math.max(Math.abs(box.x2 - box.x1), 1);
            const height = Math.max(Math.abs(box.y2 - box.y1), 1);
            ctx.fillStyle = 'rgba(46,160,67,0.16)';
            ctx.strokeStyle = 'rgba(46,160,67,0.55)';
            ctx.lineWidth = 1;
            ctx.fillRect(x, y, width, height);
            ctx.strokeRect(x, y, width, height);
            ctx.fillStyle = 'rgba(46,160,67,0.95)';
            ctx.fillText(box.label, x + 8, y - 5);
          }
        });
      }
    }

    class ZoneBandsPaneView {
      constructor(source) {
        this._source = source;
        this._boxes = [];
      }
      zOrder() {
        return 'bottom';
      }
      update() {
        const host = this._source._chart;
        const series = this._source._series;
        if (!host || !series) {
          this._boxes = [];
          return;
        }
        const timeScale = host.timeScale();
        const spacing = timeScale.options().barSpacing || 6;
        this._boxes = [];
        for (const zone of this._source._zones) {
          const x1 = zoneEdgeX(timeScale, zone.valid_from, 'start', spacing);
          const x2 = zoneEdgeX(timeScale, zone.valid_to, 'end', spacing);
          const y1 = series.priceToCoordinate(Number(zone.high));
          const y2 = series.priceToCoordinate(Number(zone.low));
          if (x1 === null || x2 === null || y1 === null || y2 === null) continue;
          this._boxes.push({ x1, x2, y1, y2, label: zone.label });
        }
      }
      renderer() {
        return new ZoneBandsRenderer(this._boxes);
      }
    }

    // One primitive draws every support band so zoom/pan stay on the library.
    class ZoneBandsPrimitive {
      constructor(zones) {
        this._zones = zones;
        this._views = [new ZoneBandsPaneView(this)];
        this._chart = null;
        this._series = null;
      }
      attached(param) {
        this._chart = param.chart;
        this._series = param.series;
      }
      detached() {
        this._chart = null;
        this._series = null;
      }
      updateAllViews() {
        this._views[0].update();
      }
      paneViews() {
        return this._views;
      }
    }

    function formatPrice(value) {
      if (value === null || value === undefined) return 'n/a';
      return Number(value).toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    function formatCandleCount(visibleCount, totalCount) {
      if (Number.isFinite(totalCount) && totalCount > visibleCount) {
        return `${visibleCount} of ${totalCount} closed candles`;
      }
      return `${visibleCount} closed candles`;
    }

    const UTC7_OFFSET_MS = 7 * 60 * 60 * 1000;

    // Display-only: shift the UTC instant into UTC+7 wall time. API times stay UTC.
    function formatUtc7(ms, withSeconds) {
      if (ms === null || ms === undefined || !Number.isFinite(Number(ms))) return 'n/a';
      const shifted = new Date(Number(ms) + UTC7_OFFSET_MS);
      const stamp = shifted.toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, '');
      return (withSeconds === false ? stamp.slice(0, 16) : stamp) + ' +07:00';
    }

    function formatUtc7Tick(time, tickMarkType) {
      const shifted = new Date(Number(time) * 1000 + UTC7_OFFSET_MS);
      const year = shifted.getUTCFullYear();
      const month = String(shifted.getUTCMonth() + 1).padStart(2, '0');
      const day = String(shifted.getUTCDate()).padStart(2, '0');
      const hour = String(shifted.getUTCHours()).padStart(2, '0');
      const minute = String(shifted.getUTCMinutes()).padStart(2, '0');
      if (tickMarkType === 0) return String(year);
      if (tickMarkType === 1) return `${year}-${month}`;
      if (tickMarkType === 2) return `${month}-${day}`;
      if (tickMarkType === 4) return `${hour}:${minute}:00`;
      return `${month}-${day} ${hour}:${minute}`;
    }

    function formatOhlcLines(candle) {
      return [
        formatUtc7(Number(candle.time) * 1000),
        `O ${formatPrice(candle.open)}`,
        `H ${formatPrice(candle.high)}`,
        `L ${formatPrice(candle.low)}`,
        `C ${formatPrice(candle.close)}`
      ];
    }

    function showTooltip(candle, hit, clientX, clientY) {
      if (!candle && !hit) {
        tooltip.style.display = 'none';
        return;
      }
      const parts = [];
      if (candle) parts.push(formatOhlcLines(candle).join('\n'));
      if (hit && hit.type === 'zone') {
        const z = hit.item;
        parts.push([
          `zone ${formatPrice(z.low)}-${formatPrice(z.high)}`,
          `origin ${z.origin || 'n/a'} • ${z.bounds_style || 'n/a'}`,
          `score ${z.score == null || z.score === '' ? 'n/a' : Number(z.score).toFixed(2)} • touches ${z.touches}`,
          `rev ${z.revision_fingerprint ? String(z.revision_fingerprint).slice(0, 12) : 'n/a'}`
        ].join('\n'));
      } else if (hit && hit.type === 'pivot') {
        const p = hit.item;
        const kind = p.kind === 'high' ? 'H' : 'L';
        parts.push(`internal ${p.role || kind} @ ${formatPrice(p.wick_price)}`);
      }
      tooltip.textContent = parts.join('\n\n');
      tooltip.style.display = 'block';
      const pad = 14;
      tooltip.style.left = Math.min(clientX + pad, window.innerWidth - tooltip.offsetWidth - 8) + 'px';
      tooltip.style.top = Math.min(clientY + pad, window.innerHeight - tooltip.offsetHeight - 8) + 'px';
    }

    function hitAt(timeSec, price) {
      const timeMs = Number(timeSec) * 1000;
      const pivot = visiblePivots.find((item) => Number(item.time) === timeMs);
      if (pivot) return { type: 'pivot', item: pivot };
      if (price === null || price === undefined) return null;
      const zone = visibleZones.find((item) =>
        timeMs >= item.valid_from && timeMs < item.valid_to &&
        price >= Number(item.low) && price <= Number(item.high)
      );
      return zone ? { type: 'zone', item: zone } : null;
    }

    function resetViewport() {
      if (!chart) return;
      chart.timeScale().fitContent();
      chart.priceScale('right').applyOptions({ autoScale: true });
    }

    function requireLightweightCharts() {
      const lib = window.LightweightCharts;
      if (!lib || typeof lib.createChart !== 'function') {
        throw new Error('Lightweight Charts failed to load. The chart page needs network once to fetch the CDN script.');
      }
      return lib;
    }

    // Latest-zone helper chart: bands span the whole visible window, not a replay validity range.
    function zonesSpanningWindow(zones, candles) {
      if (!candles.length) return [];
      const firstMs = Number(candles[0].time) * 1000;
      const lastMs = Number(candles[candles.length - 1].time) * 1000;
      const validTo = lastMs + barSeconds * 1000;
      return (zones || []).map((zone) => ({
        ...zone,
        valid_from: firstMs,
        valid_to: validTo,
        label: `support ${formatPrice(zone.low)}-${formatPrice(zone.high)} (${zone.touches})`
      }));
    }

    function renderChart(data) {
      const lib = requireLightweightCharts();
      const candles = (data.candles || []).map((candle) => ({
        time: toSec(candle.time),
        open: Number(candle.open),
        high: Number(candle.high),
        low: Number(candle.low),
        close: Number(candle.close)
      }));
      if (!candles.length) throw new Error('No closed candles found in SQLite.');
      barSeconds = barSecondsFor(data.timeframe);
      candleByTime = new Map(candles.map((candle) => [candle.time, candle]));
      visibleZones = zonesSpanningWindow(data.zones && data.zones.support, candles);
      visiblePivots = data.pivots || [];

      if (chart) {
        chart.remove();
        chart = null;
        candleSeries = null;
      }
      chart = lib.createChart(container, {
        autoSize: true,
        layout: {
          background: { color: '#090c10' },
          textColor: '#8b949e',
          attributionLogo: false
        },
        grid: {
          vertLines: { color: 'rgba(139,148,158,.15)' },
          horzLines: { color: 'rgba(139,148,158,.15)' }
        },
        crosshair: { mode: lib.CrosshairMode ? lib.CrosshairMode.Normal : 0 },
        rightPriceScale: { borderColor: 'rgba(255,255,255,.12)', scaleMargins: { top: 0.08, bottom: 0.08 } },
        timeScale: {
          borderColor: 'rgba(255,255,255,.12)',
          timeVisible: true,
          secondsVisible: false,
          tickMarkFormatter: (time, tickMarkType) => formatUtc7Tick(time, tickMarkType)
        },
        localization: {
          locale: 'en-GB',
          timeFormatter: (time) => formatUtc7(Number(time) * 1000),
          priceFormatter: (price) => formatPrice(price)
        }
      });
      candleSeries = chart.addSeries(lib.CandlestickSeries, {
        upColor: '#3fb950',
        downColor: '#ff7b72',
        borderUpColor: '#3fb950',
        borderDownColor: '#ff7b72',
        wickUpColor: '#3fb950',
        wickDownColor: '#ff7b72'
      });
      candleSeries.setData(candles);
      candleSeries.attachPrimitive(new ZoneBandsPrimitive(visibleZones));

      const markers = visiblePivots.map((pivot) => {
        const isHigh = pivot.kind === 'high';
        const role = pivot.role || (isHigh ? 'H' : 'L');
        return {
          time: toSec(pivot.time),
          position: isHigh ? 'aboveBar' : 'belowBar',
          color: '#79c0ff',
          shape: isHigh ? 'arrowDown' : 'arrowUp',
          text: `internal ${role}`
        };
      });
      if (typeof lib.createSeriesMarkers === 'function') {
        lib.createSeriesMarkers(candleSeries, markers);
      } else if (typeof candleSeries.setMarkers === 'function') {
        candleSeries.setMarkers(markers);
      }

      chart.subscribeCrosshairMove((param) => {
        if (!param.point || param.time === undefined || param.time === null) {
          showTooltip(null, null);
          return;
        }
        const seriesPoint = param.seriesData && param.seriesData.get(candleSeries);
        const candle = seriesPoint || candleByTime.get(param.time) || null;
        const price = candleSeries.coordinateToPrice(param.point.y);
        const rect = container.getBoundingClientRect();
        showTooltip(candle, hitAt(param.time, price), rect.left + param.point.x, rect.top + param.point.y);
      });
      resetViewport();
    }

    async function load() {
      error.style.display = 'none';
      tooltip.style.display = 'none';
      const params = new URLSearchParams(viewOptions[viewSelect.value] || viewOptions['4h-from-june']);
      const response = await fetch(`/api/chart?${params.toString()}`);
      if (!response.ok) throw new Error(`Chart API failed: ${response.status}`);
      chartData = await response.json();
      title.textContent = `${chartData.symbol} ${chartData.timeframe.toUpperCase()}`;
      const candleText = formatCandleCount(chartData.candles.length, chartData.total_candles);
      meta.textContent = `${candleText} • last close ${formatPrice(chartData.current_price)}`;
      renderChart(chartData);
    }

    function showLoadError(err) {
      error.style.display = 'block';
      error.textContent = err.message;
    }

    resetView.addEventListener('click', resetViewport);
    viewSelect.addEventListener('change', () => {
      load().catch(showLoadError);
    });
    load().catch(showLoadError);
  </script>
</body>
</html>
