exchange: binance
symbol: BTCUSDT
timeframe: 4h
database_path: data/prana_buy_the_dips.sqlite
environment: dev

wallet:
  keystore_path: data/wallet/trader-dev.json
  expected_address: null # set this to the checksum address printed by wallet-create
  password_env: KEYSTORE_PASSWORD # value comes from the environment, never YAML

execution:
  chain_id: 137
  rpc_url_env: POLYGON_RPC_URL # URL comes from the environment, never YAML
  quote_base_url: https://prana.triethocduongpho.net
  router_allowlist:
    - "0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45"
  live_enabled: false
  max_approval_gas: 100000
  receipt_timeout_seconds: 120

risk:
  trade_amount_usdt: "1"
  max_cumulative_usdt: "10"

zones: # values ending in _pct are fractions of price, not percent labels
  min_touches: 2
  role_buffer_pct: 0.0015 # 0.15%
  internal_swing_order: 2
  external_swing_order: 5
  atr_period: 14 # 14 candles
  break_atr_mult: 0.2 # 0.2x ATR
  external_min_swing_atr_mult: 4.0
  external_min_swing_pct: 2.5
  show_internal_pivots: false

price_feed:
  timeframe: 1h # the live cycle fetches only 1h klines
  fetch_limit: 168

strategy:
  version: support_close_v1
  config_version: "1"
  dip_lookback_hours: 48
  cooldown_hours: 24
  below_zone_min_pct: 0.50
  inside_zone_max_pct: 0.70
