exchange: binance
symbol: BTCUSDT
timeframe: 4h
database_path: data/prana_buy_the_dips.sqlite
environment: dev

wallet:
  keystore_path: data/wallet/trader-dev.json
  expected_address: null # set this to the checksum address printed by wallet-create
  password_env: KEYSTORE_PASSWORD # value comes from the environment, never YAML

execution:
  chain_id: 137
  rpc_url_env: POLYGON_RPC_URL # URL comes from the environment, never YAML
  quote_base_url: https://prana.triethocduongpho.net
  router_allowlist:
    - "0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45"
  live_enabled: false
  slippage_bps: 50 # 0.5%; accepted range is 1-500
  quote_timeout_seconds: 10
  quote_min_deadline_seconds: 30 # reject quotes with too little time left
  max_swap_gas: 750000
  max_approval_gas: 100000
  receipt_timeout_seconds: 120

risk:
  trade_amount_usdt: "1"
  max_trades_per_utc_day: 3
  max_cumulative_usdt: "10"
  min_pol_reserve: "0.01" # retained after the conservative approval + swap gas budget
  pause_file: data/PAUSE_TRADING # create this file to skip dry_run/live execution

logging:
  level: INFO
  file_path: data/logs/trading.jsonl # JSON Lines; redacted and size-rotated
  max_bytes: 2000000
  backup_count: 5

zones: # values ending in _pct are fractions of price, not percent labels
  min_touches: 2
  role_buffer_pct: 0.0015 # 0.15%
  # Fallback for gaps with a support/active lower boundary, including gaps below price.
  near_price_gap_fill_edge_clearance: 650.0 # lower to allow tighter spacing for strong shelves
  near_price_gap_fill_midpoint_spacing: 1000.0 # same as regular $1000 midpoint spacing
  near_price_gap_fill_min_touches: 4 # stronger evidence than the regular min_touches path
  internal_swing_order: 2 # candles each side for internal pivots; local reactions and internal stairs use this
  external_swing_order: 5
  atr_period: 14 # 14 candles
  break_atr_mult: 0.2 # 0.2x ATR
  external_min_swing_atr_mult: 4.0
  external_min_swing_pct: 2.5
  show_internal_pivots: false

price_feed:
  timeframe: 1h # the live cycle fetches only 1h klines
  fetch_limit: 168

strategy:
  version: support_close_v2
  config_version: "1"
  dip_lookback_hours: 48
  cooldown_hours: 24 # per-zone no-buy window; after it elapses the same zone still needs a new dip origin
  below_zone_min_pct: 0.50 # below-zone BUY requires close in this fraction…100% of (next_lower.high → zone.low)
  inside_zone_max_pct: 1.00 # inside-zone BUY allows close from zone.low (0%) up to this fraction of (zone.low → zone.high)
